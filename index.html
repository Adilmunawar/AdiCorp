<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>AdiCorp HR</title>
    <link rel="icon" type="image/png" href="/AdilMunawar-Uploads/AdiCorp%20-%20Logo.png" />
    <link rel="apple-touch-icon" href="/AdilMunawar-Uploads/AdiCorp%20-%20Logo.png" />
    <link rel="preload" as="image" href="/AdilMunawar-Uploads/AdiCorp%20-%20Logo.png" fetchpriority="high" />
    <meta name="description" content="AdiCorp HR: people, time, leave, payroll and employee self-service in one secure workspace." />
    <meta name="author" content="AdiCorp" />

    <meta property="og:title" content="AdiCorp HR" />
    <meta property="og:description" content="People, time, leave, payroll and employee self-service in one secure workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/AdilMunawar-Uploads/AdiCorp%20-%20Logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AdiCorp HR" />
    <meta name="twitter:image" content="/AdilMunawar-Uploads/AdiCorp%20-%20Logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Static splash shown before the JS bundle runs. It mirrors the full-screen
      BrandLoader (src/components/common/BrandLoader.tsx + src/styles/loader.css)
      closely, so React takes over without a visible jump. (No inline script: the CSP in vercel.json allows only self-hosted scripts.)
      Colours are the palette hexes from src/styles/palette.css.
    -->
    <style>
      html,body{margin:0}
      .sp-root{display:flex;min-height:100vh;min-height:100dvh;width:100%;align-items:center;justify-content:center;padding:0 16px;box-sizing:border-box;background-color:#fff;background-image:radial-gradient(120% 70% at 50% 0%,rgba(226,238,254,.7) 0%,rgba(241,248,255,.45) 38%,transparent 72%),linear-gradient(180deg,#f8fafc 0%,#fff 100%);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
      .sp-stack{display:flex;width:100%;max-width:18rem;flex-direction:column;align-items:center;text-align:center}
      .sp-logo{width:clamp(2.75rem,8vh,4rem);height:clamp(2.75rem,8vh,4rem);object-fit:contain;filter:drop-shadow(0 6px 14px rgba(7,77,183,.18));animation:sp-float 2.4s ease-in-out infinite}
      .sp-name{margin:clamp(.75rem,2.2vh,1.25rem) 0 0;font:600 17px/24px "DM Sans",sans-serif;letter-spacing:-.01em;color:#141925}
      .sp-name span{color:#074db7}
      .sp-bar{position:relative;margin-top:16px;height:3px;width:112px;overflow:hidden;border-radius:9999px;background:rgba(7,77,183,.12)}
      .sp-bar span{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:9999px;background:linear-gradient(90deg,rgba(50,132,247,0) 0%,#3284f7 45%,#074db7 100%);animation:sp-slide 1.2s cubic-bezier(.65,0,.35,1) infinite}
      .sp-msg{margin:12px 0 0;height:20px;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;line-height:20px;font-weight:500;color:#656e7c;animation:sp-fade .3s ease-out .7s both}
      .sp-root .sp-logo,.sp-root .sp-bar span{animation-delay:var(--adl-delay,0ms);will-change:transform}
      @keyframes sp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes sp-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @keyframes sp-fade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.sp-root .sp-logo,.sp-root .sp-bar span,.sp-msg{animation:none}.sp-bar span{transform:translateX(75%)}}
    </style>
  </head>

  <body>
    <div id="root"><div id="adl-splash" class="sp-root" role="status" aria-live="polite" aria-busy="true"><div class="sp-stack"><img class="sp-logo" src="/AdilMunawar-Uploads/AdiCorp%20-%20Logo.png" alt="" width="64" height="64" decoding="async" draggable="false" /><p class="sp-name">AdiCorp <span>HR</span></p><div class="sp-bar"><span></span></div><p class="sp-msg">Loading your workspace</p></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
